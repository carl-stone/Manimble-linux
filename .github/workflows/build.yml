# Builds the macOS app on every push and PR, so a change can't quietly break the build.
name: build
on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: apps/macos/build_app.sh
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config python3.12 python3.12-dev python3.12-venv \
            libcairo2-dev libpango1.0-dev ffmpeg poppler-utils ghostscript espeak-ng \
            texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra \
            texlive-science texlive-lang-english texlive-xetex dvisvgm \
            fontconfig fonts-dejavu-core libegl1 libgl1 libopengl0 libgl1-mesa-dri libgbm1 \
            libdbus-1-3 libnss3 libnspr4 libasound2t64 libpulse0 libx11-xcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libxkbfile1 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            shared-mime-info desktop-file-utils xdg-utils xvfb dbus-x11
      - name: Install and verify Linux client as the runner user
        shell: bash
        run: |
          PROFILE=()
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] &&
             [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == 1 ]]; then
            sudo apt-get install -y apparmor
            PROFILE=(--install-webengine-profile)
          fi
          ./install_manimble.sh --no-system-deps --yes "${PROFILE[@]}"
          PY="${XDG_DATA_HOME:-$HOME/.local/share}/manimble/python/bin/python"
          export PATH="$(dirname "$PY"):$HOME/.local/bin:$PATH"
          "$PY" -m pip check
          "$PY" -m unittest discover -s tests -p 'test_manimbler.py' -v
          PYTHONPATH="$PWD/apps/linux:$PWD/engine" QT_API=pyside6 \
            dbus-run-session -- xvfb-run -a "$PY" -m unittest discover -s apps/linux/tests -p 'test_*.py' -v
          ~/.local/bin/manimble --help
          ~/.local/bin/manimbler --help
